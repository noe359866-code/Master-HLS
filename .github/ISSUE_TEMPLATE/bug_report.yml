name: Bug report
description: Report a reproducible bug in WuPlay (one per issue).
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        If we can reproduce it, we can usually fix it. Please describe the bug in enough detail that someone else can understand what failed without watching a video or guessing from the title.
        Please replace the default title with a short summary of the actual problem, for example `[Bug]: Continue Watching shows percent instead of time left`.

        Vague reports such as "not working", "broken", or "same issue" may be labeled `needs-info` and closed after 7 days if the missing details are not added.
        Bug reports with no activity for more than 30 days may be closed as stale.
        If the app crashes or force closes, logs are required. Crash reports without logs will be asked for logs before triage.

  - type: markdown
    attributes:
      value: |
        ## Quick checks

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I can reproduce this on the latest release.
          required: false
        - label: This issue is limited to a single bug (not multiple unrelated problems).
          required: true
        - label: This is not an add-on or content problem (it happens with more than one add-on/source).
          required: true
        - label: I understand WuPlay does not host or provide content, and this report contains no links to copyrighted material.
          required: true

  - type: markdown
    attributes:
      value: |
        ## Version & device

  - type: input
    id: app_version
    attributes:
      label: App version
      description: Shown in Settings → About (for example 0.9.3-beta). If you installed from a CI build, add the commit hash.
      placeholder: "e.g. 0.9.3-beta"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Install method
      options:
        - GitHub Release APK
        - Downloader app (code 5781040)
        - CI build / nightly
        - Built from source
        - Other (please describe below)
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android TV
        - Google TV
        - Fire TV
        - Android phone/tablet
        - Android emulator
        - Other (please describe below)
    validations:
      required: true

  - type: input
    id: device_model
    attributes:
      label: Device model
      description: "Example: Chromecast with Google TV, NVIDIA Shield TV, Mi Box, Fire TV Stick 4K, etc."
      placeholder: "e.g. Chromecast with Google TV (HD)"
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android version
      placeholder: "e.g. Android 12"
    validations:
      required: true

  - type: dropdown
    id: player_mode
    attributes:
      label: Player mode
      description: If you use an external player, most playback issues must be reported to that player instead.
      options:
        - Internal player
        - External player
        - Ask every time
        - Not sure
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## What happened?

  - type: dropdown
    id: area
    attributes:
      label: Area (tag)
      description: Pick the closest match. It helps triage.
      options:
        - Playback (start/stop/buffering)
        - Streams / add-ons (selection, loading, errors)
        - Subtitles (download, styling, sync)
        - Audio tracks
        - Catalogs / Home / Discover
        - Search
        - Watchlist / Library
        - Watch history & progress
        - Profiles
        - Multi-device sync
        - Web configurator
        - Focus / remote navigation
        - UI / Layout
        - Settings
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: |
        Explain the problem in detail. Do not only write "not working" or "same issue".
        Include what screen/flow you were using, what you pressed on the remote, what changed on screen, and any visible error text.
      placeholder: |
        I was trying to ...
        The app ...
        I saw ...
        This happens on ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, one action per line. If it depends on specific content, describe it (movie/series, season/episode, add-on name) without sharing private or copyrighted links.
      placeholder: |
        1. Open ...
        2. Navigate to ...
        3. Press ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "What you expected to happen."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: "What actually happened? Include any on-screen error text/codes and whether the app froze, crashed, ignored remote input, showed the wrong content, etc."
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Always
        - Often (more than 50%)
        - Sometimes
        - Rarely
        - Once
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Did this work before?
      options:
        - Not sure
        - Yes, it used to work
        - No, it never worked
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Extra context

  - type: textarea
    id: media_details
    attributes:
      label: Media details (optional)
      description: Only include what you can safely share. Do not paste add-on URLs that point to copyrighted content.
      placeholder: |
        - Content type: series/movie
        - Season/Episode: S1E2
        - Add-on / source label: (name only)
        - Video/audio format: (if known)
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs (required for crash reports)
      description: |
        Required if the app crashes or force closes.
        For other bug reports, logs are optional but still helpful.
        Attach a short snippet from around the time the bug happens.
      render: shell
      placeholder: |
        adb logcat -d | tail -n 300
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else? (optional)
      description: Screenshots/recordings, related issues, workarounds, etc.
    validations:
      required: false
