name: Feature request
description: Suggest an improvement or a new feature for WuPlay.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        One feature request per issue, please. The more concrete your use case is, the easier it is to evaluate.

        This repository tracks releases and issues only; it does not contain the app source code.
        Requests are reviewed as product proposals first. Please do not open a pull request for a new feature or a broad UX change unless a maintainer has explicitly approved it.
        Unapproved feature PRs are usually closed.

  - type: dropdown
    id: area
    attributes:
      label: Area (tag)
      options:
        - Playback
        - Streams / add-ons
        - Subtitles
        - Audio
        - Catalogs / Home / Discover
        - Search
        - Watchlist / Library
        - Watch history & progress
        - Profiles
        - Multi-device sync
        - Web configurator
        - Focus / remote navigation
        - UI / Layout
        - Settings
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
      placeholder: "I want to be able to..."
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: What would you like the app to do?
    validations:
      required: true

  - type: dropdown
    id: contribution_plan
    attributes:
      label: Are you planning to implement this yourself?
      description: Major features are usually implemented in-house unless approved first.
      options:
        - No, this is only a proposal
        - Maybe, but only if approved first
        - Yes, but I understand implementation still needs maintainer approval
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Any workarounds or other approaches you considered.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context (optional)
      description: Mockups, examples from other apps, related issues, etc.
    validations:
      required: false
