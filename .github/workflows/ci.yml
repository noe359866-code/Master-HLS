name: CI

on:
  push:
    branches: ['main', 'arena/**', 'fix/**', 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Servidor, paquetes y web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:packages
      - run: npm run build:web

  android:
    name: APK Android TV
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Las imagenes ubuntu-latest ya traen el SDK de Android preinstalado
      # (ANDROID_HOME apunta a /usr/local/lib/android/sdk). Antes se usaba
      # android-actions/setup-android@v3, que rompia el job en las imagenes
      # nuevas antes de llegar a compilar.
      - name: Preparar Android SDK
        working-directory: .
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM="$SDK/cmdline-tools/bin/sdkmanager"
          fi
          if [ ! -x "$SM" ]; then
            SM="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SM" ] || [ ! -x "$SM" ]; then
            echo "::error::No se encontro sdkmanager. SDK=$SDK"
            ls -la "$SDK" || true
            exit 1
          fi
          echo "sdkmanager: $SM"

          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Compilar APK debug
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/gradle-build.log"
          if ./gradlew :app:assembleDebug --no-daemon --stacktrace > "$LOG" 2>&1; then
            tail -n 25 "$LOG"
            exit 0
          fi
          tail -n 80 "$LOG" || true
          REPORT="$RUNNER_TEMP/report.md"
          python3 - "$LOG" "$REPORT" <<'PYEOF'
          import sys
          log, report = sys.argv[1], sys.argv[2]
          with open(log, errors="replace") as fh:
              lines = [line.rstrip() for line in fh]
          errors = [
              line for line in lines
              if line.startswith("e: ")
              or line.startswith("error:")
              or "What went wrong" in line
              or ("FAILED" in line and line.startswith("> Task"))
              or line.startswith("Caused by")
          ]
          errors = errors[:80] or ["(sin lineas e:/error en el log)"]
          with open(report, "w") as out:
              out.write("### Error de compilacion del APK\n\n```\n")
              out.write("\n".join(errors)[:55000])
              out.write("\n```\n")
          print("::error::APK Android fallo. Detalle en el issue 'CI log Android'.")
          PYEOF
          # Los logs de Actions no son legibles desde el sandbox de desarrollo:
          # se deja el detalle en un issue del repositorio.
          ENV_TOKEN="${{ github.token }}"
          REPO="${{ github.repository }}"
          export GH_TOKEN="$ENV_TOKEN"
          NUM="$(gh api "repos/$REPO/issues?state=all&per_page=100" --jq '[.[] | select(.title == "CI log Android")][0].number // empty' || true)"
          if [ -z "$NUM" ]; then
            NUM="$(gh api -X POST "repos/$REPO/issues" -f title="CI log Android" -f body="Registro de errores de compilacion del APK de Android TV." --jq .number)"
          fi
          gh api -X POST "repos/$REPO/issues/$NUM/comments" -F body=@"$REPORT" > /dev/null || true
          exit 1

      - name: Tests unitarios Kotlin
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          echo "APK=$APK"
          cp "$APK" ../artifacts/vibe-flix-tv-debug.apk
          ls -lh ../artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-flix-debug-apk
          path: artifacts/vibe-flix-tv-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar APK en Releases
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vibe-flix-debug-apk
          path: artifacts
      - name: Crear release con el APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/vibe-flix-tv-debug.apk \
            --title "Vibe Flix TV $TAG" \
            --notes "APK debug generado automaticamente desde $TAG." \
            --repo "$GH_REPO"
