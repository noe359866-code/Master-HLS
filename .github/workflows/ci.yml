name: CI

on:
  push:
    branches: ['main', 'arena/**', 'fix/**', 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Servidor, paquetes y web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:packages
      - run: npm run build:web

  android:
    name: APK Android TV
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Las imagenes ubuntu-latest ya traen el SDK de Android preinstalado
      # (ANDROID_HOME apunta a /usr/local/lib/android/sdk).
      - name: Preparar Android SDK
        working-directory: .
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM="$SDK/cmdline-tools/bin/sdkmanager"
          fi
          if [ ! -x "$SM" ]; then
            SM="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SM" ] || [ ! -x "$SM" ]; then
            echo "::error::No se encontro sdkmanager. SDK=$SDK"
            ls -la "$SDK" || true
            exit 1
          fi
          echo "sdkmanager: $SM"

          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Configurar keystore de produccion
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VIBFLIX_RELEASE_STORE_PASSWORD: ${{ secrets.VIBFLIX_RELEASE_STORE_PASSWORD }}
          VIBFLIX_RELEASE_KEY_PASSWORD: ${{ secrets.VIBFLIX_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Soporta ambos namespaces de secrets: ANDROID_* y VIBFLIX_*
          STORE_B64="${ANDROID_KEYSTORE_BASE64:-}"
          STORE_PASS="${ANDROID_KEYSTORE_PASSWORD:-${VIBFLIX_RELEASE_STORE_PASSWORD:-}}"
          KEY_ALIAS="${ANDROID_KEY_ALIAS:-vibeflix}"
          KEY_PASS="${ANDROID_KEY_PASSWORD:-${VIBFLIX_RELEASE_KEY_PASSWORD:-}}"

          KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/release.keystore"
          GRADLE_PROPS="$GITHUB_WORKSPACE/android/gradle.properties"

          # Si hay keystore en secrets, decodificarlo
          if [ -n "$STORE_B64" ]; then
            echo "Usando keystore de produccion desde secrets"
            echo "$STORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            [ -n "$STORE_PASS" ] || STORE_PASS="$KEY_PASS"
            [ -n "$KEY_PASS" ] || KEY_PASS="$STORE_PASS"
            {
              echo "vibeFlix.releaseStoreFile=$KEYSTORE_PATH"
              echo "vibeFlix.releaseStorePassword=$STORE_PASS"
              echo "vibeFlix.releaseKeyAlias=$KEY_ALIAS"
              echo "vibeFlix.releaseKeyPassword=$KEY_PASS"
            } >> "$GRADLE_PROPS"
            echo "VIBFLIX_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "VIBFLIX_RELEASE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "VIBFLIX_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "VIBFLIX_RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            ls -lh "$KEYSTORE_PATH"
            exit 0
          fi

          # Sin secrets: generar keystore efimero para builds de produccion / verificacion.
          # IMPORTANTE: este keystore cambia en cada ejecucion si no se guarda como secret.
          # Para Play Store necesitas un keystore estable: genera uno localmente y guardalo como
          # ANDROID_KEYSTORE_BASE64 (base64 -w0 release.keystore) + passwords en Settings > Secrets.
          echo "No hay keystore en secrets: generando keystore efimero para v0.0.3"
          STORE_PASS="vibeflix-release-0.0.3"
          KEY_ALIAS="vibeflix"
          KEY_PASS="$STORE_PASS"
          DNAME="CN=Vibe Flix, OU=Vibe Flix TV, O=Vibe Flix, L=Managua, S=Managua, C=NI"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "$DNAME" > /dev/null
          ls -lh "$KEYSTORE_PATH"
          {
            echo "vibeFlix.releaseStoreFile=$KEYSTORE_PATH"
            echo "vibeFlix.releaseStorePassword=$STORE_PASS"
            echo "vibeFlix.releaseKeyAlias=$KEY_ALIAS"
            echo "vibeFlix.releaseKeyPassword=$KEY_PASS"
          } >> "$GRADLE_PROPS"
          echo "VIBFLIX_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "VIBFLIX_RELEASE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "VIBFLIX_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "VIBFLIX_RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          echo "::notice::APK firmado con keystore efimero. Para Play Store guarda un keystore estable en Secrets."

      - name: Compilar APK
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/gradle-build.log"
          # Produccion real: tags vX.Y.Z sin sufijo -debug -> assembleRelease (minify + shrink, firmado)
          # Debug: ramas, PRs y tags *-debug -> assembleDebug
          REF="${GITHUB_REF:-}"
          VARIANT="debug"
          TASK=":app:assembleDebug"
          if [[ "$REF" == refs/tags/v* ]] && [[ "$REF" != *-debug* ]]; then
            VARIANT="release"
            TASK=":app:assembleRelease"
          fi
          echo "Ref: $REF -> variant=$VARIANT task=$TASK"
          echo "VARIANT=$VARIANT" >> "$GITHUB_ENV"
          if ./gradlew "$TASK" --no-daemon --stacktrace > "$LOG" 2>&1; then
            tail -n 35 "$LOG"
            # Verificar firma en release
            if [ "$VARIANT" = "release" ]; then
              echo "--- Verificando APK release ---"
              APK_OUT=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
              echo "APK: $APK_OUT"
              "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$APK_OUT" | head -n 20 || true
              ls -lh "$APK_OUT" || true
            fi
            exit 0
          fi
          tail -n 80 "$LOG" || true
          REPORT="$RUNNER_TEMP/report.md"
          python3 - "$LOG" "$REPORT" <<'PYEOF'
          import sys
          log, report = sys.argv[1], sys.argv[2]
          with open(log, errors="replace") as fh:
              lines = [line.rstrip() for line in fh]
          errors = [
              line for line in lines
              if line.startswith("e: ")
              or "error:" in line
              or "What went wrong" in line
              or ("FAILED" in line and line.startswith("> Task"))
              or line.startswith("Caused by")
              or line.strip().startswith("symbol:")
              or line.strip().startswith("location:")
          ]
          tail = lines[-120:]
          with open(report, "w") as out:
              out.write("### Error de compilacion del APK\n\n```\n")
              out.write("\n".join(errors[:150]) or "(sin lineas de error reconocibles)")
              out.write("\n\n--- ultimas 120 lineas ---\n")
              out.write("\n".join(tail))
              out.write("\n```\n")
          print("::error::APK Android fallo. Detalle en el issue 'CI log Android'.")
          PYEOF
          ENV_TOKEN="${{ github.token }}"
          REPO="${{ github.repository }}"
          export GH_TOKEN="$ENV_TOKEN"
          NUM="$(gh api "repos/$REPO/issues?state=all&per_page=100" --jq '[.[] | select(.title == "CI log Android")][0].number // empty' || true)"
          if [ -z "$NUM" ]; then
            NUM="$(gh api -X POST "repos/$REPO/issues" -f title="CI log Android" -f body="Registro de errores de compilacion del APK de Android TV." --jq .number)"
          fi
          gh api -X POST "repos/$REPO/issues/$NUM/comments" -F body=@"$REPORT" > /dev/null || true
          exit 1

      - name: Tests unitarios Kotlin
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          echo "VARIANT=$VARIANT"
          if [ "$VARIANT" = "release" ]; then
            APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
            echo "APK=$APK"
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION="${VERSION%%-*}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              VERSION="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
            fi
            echo "VERSION=$VERSION"
            echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
            cp "$APK" "../artifacts/vibe-flix-tv-${VERSION}-release.apk"
            cp "$APK" ../artifacts/vibe-flix-tv-release.apk
            ls -lh ../artifacts
            # checksum para verificacion
            sha256sum ../artifacts/*.apk | tee ../artifacts/checksums.txt
          else
            APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
            echo "APK=$APK"
            cp "$APK" ../artifacts/vibe-flix-tv-debug.apk
            ls -lh ../artifacts
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-flix-apk-${{ env.VARIANT }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - if: env.VARIANT == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: vibe-flix-checksums
          path: artifacts/checksums.txt
          if-no-files-found: warn

  release:
    name: Publicar APK en Releases
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determinar variante esperada
        id: variant
        run: |
          REF="${{ github.ref }}"
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$REF" == *-debug* ]]; then
            echo "artifact=vibe-flix-apk-debug" >> "$GITHUB_OUTPUT"
            echo "apk=vibe-flix-tv-debug.apk" >> "$GITHUB_OUTPUT"
            echo "title_suffix=(debug)" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=vibe-flix-apk-release" >> "$GITHUB_OUTPUT"
            echo "apk=vibe-flix-tv-${VERSION}-release.apk" >> "$GITHUB_OUTPUT"
            echo "apk_alt=vibe-flix-tv-release.apk" >> "$GITHUB_OUTPUT"
            echo "title_suffix=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.variant.outputs.artifact }}
          path: artifacts

      - name: Verificar artefacto
        run: ls -lh artifacts/ && sha256sum artifacts/*.apk || true

      - name: Crear release con el APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.variant.outputs.apk }}
        run: |
          set -euo pipefail
          REF="${{ github.ref }}"
          VERSION="${{ steps.variant.outputs.version }}"
          if [[ "$REF" == *-debug* ]]; then
            TITLE="Vibe Flix TV $TAG (debug)"
            NOTES="APK debug generado automáticamente desde $TAG (sin ofuscación)."
          else
            TITLE="Vibe Flix TV $TAG"
            NOTES="APK de producción **$TAG** (versionName \`$VERSION\`) firmado y optimizado (minify + shrink + proguard). Instalable en Android TV / Fire TV / TV Box con \`adb install\` o un gestor de archivos.

          **Antes de instalarlo necesitas el servidor**
          Esta app es un cliente: sin un servidor Vibe Flix en tu red no carga catálogos.
          \`\`\`bash
          docker compose up -d   # en un PC/NAS de la misma red, puerto 8181
          \`\`\`
          Define \`PUBLIC_URL=http://IP_DEL_SERVIDOR:8181\` en un archivo \`.env\` junto al compose.

          **Instalación en la TV**
          1. Descarga el APK de abajo.
          2. \`adb install -r vibe-flix-tv-${VERSION}-release.apk\` o ábrelo desde Downloader/gestor de archivos.
          3. Abre **Vibe Flix → ⚙ Servidor**, escribe \`IP:8181\` (ej. \`192.168.1.50:8181\`), prueba la conexión y guarda. \`10.0.2.2\` solo vale en emulador.

          **Notas**
          - Firmado con keystore de producción si configuraste los Secrets \`ANDROID_KEYSTORE_*\`; si no, con un keystore efímero de CI. Con firma distinta hay que **desinstalar** la versión anterior antes de instalar esta.
          - Para actualizaciones sin reinstalar, guarda un keystore estable en Secrets."
          fi
          fi
          echo "Publicando $TAG: $TITLE con $APK"
          ls -lh artifacts/
          # El artefacto release contiene dos nombres; prioriza el versionado
          FILE="artifacts/$APK"
          if [ ! -f "$FILE" ] && [ -n "${{ steps.variant.outputs.apk_alt }}" ]; then
            FILE="artifacts/${{ steps.variant.outputs.apk_alt }}"
          fi
          if [ ! -f "$FILE" ]; then
            FILE="$(find artifacts -name '*.apk' | head -n 1)"
          fi
          echo "Usando: $FILE"
          gh release create "$TAG" "$FILE" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --repo "$GH_REPO"
